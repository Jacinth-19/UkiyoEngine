name: build

on:
  push:
    branches: [ "arena/7971959b-ukiyoengine", "arena/da507d27-ukiyoengine", "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

# ccache settings shared by every job. The cache is the difference between a four-minute build and a one-minute one:
# only the files a change actually touches are recompiled, and every other translation unit comes back as an object
# file from the previous run.
env:
  CCACHE_COMPRESS: "1"
  CCACHE_COMPRESSLEVEL: "6"
  CCACHE_MAXSIZE: "2G"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # ccache, before anything configures the build: CMAKE_*_COMPILER_LAUNCHER below makes every compile go through
      # it. The key is per-platform, not per-commit, so each run restores the newest cache from the branch and only
      # recompiles what changed. Qt comes from apt and is not cached — it is unchanged between runs, so apt's own
      # download cache inside the runner image handles it.
      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: linux-release
          max-size: 2G
      - name: Install dependencies
        run: |
          sudo apt-get update
          # GLM, nlohmann_json and GLFW are vendored under third_party/ (third_party/VENDOR.md), so their -dev packages
          # are not installed. GLFW is built from source and its X11 backend needs these headers; the Wayland backend
          # is off (see the GLFW_BUILD_WAYLAND block in CMakeLists.txt), which is why no wayland-scanner is needed.
          sudo apt-get install -y cmake g++ ccache libvulkan-dev glslang-tools glslang-dev python3 python3-pip \
            qt6-base-dev qt6-base-dev-tools libqt6opengl6-dev qt6-tools-dev qt6-tools-dev-tools \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libxext-dev
      - name: Configure CMake
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - name: Build Everything
        run: |
          set -o pipefail
          cmake --build build --parallel 4 2>&1 | tee build.log
      # A compiler error in a 4-minute log is hard to find, so the failing lines are lifted into the run's
      # annotations, where the summary shows them without downloading anything.
      # The hit rate is the number that says whether the cache is doing its job; it is printed on every run, pass or
      # fail, so a regression in the cache is visible without downloading anything.
      - name: ccache stats
        if: always()
        run: ccache --show-stats --verbose 2>/dev/null || ccache --show-stats

      - name: Annotate compile errors
        if: failure()
        run: |
          grep -E "error:|Error [0-9]" build.log | head -40 | while IFS= read -r line; do
            echo "::error::${line//'%'/'%25'}"
          done
      - name: Run Systems Test
        run: ./build/systems_test
      - name: Run Network Test
        run: ./build/network_test
      - name: Run Project Template Test
        run: ./build/project_test
      - name: Run Virtual Geometry Test
        run: ./build/vgeom_test
      - name: Run Motion Matching Test
        run: ./build/motion_test
      # The estimator's maths, mirrored on the CPU: the shader cannot run here, but its algebra can be checked.
      - name: Run Real-Time GI Test
        run: ./build/gi_test
      # The input runtime, its asset format and its actions, driven from synthetic devices: no window, no GPU, no GLFW.
      # It checks press/hold/tap/multitap, 1D and 2D composites, processors, control schemes, rebinding, and that the
      # .inputactions file the engine writes loads back byte-for-byte. docs/INPUT.md.
      - name: Run Input System Test
        run: ./build/input_test
      # NOTICE.md claims the ground textures are complete and correct. This checks that claim: every layer has
      # albedo/normal/AO at the atlas size, the three layers are genuinely different images, and the normal maps are
      # tangent-space rather than mis-exported. It is cheap and it is the difference between a documented promise and
      # a tested one.
      - name: Verify terrain texture coverage
        run: |
          python3 -m pip install --quiet --break-system-packages pillow
          python3 tools/verify_terrain_textures.py --repo .
      # Bindings are the one class of shader bug a compiler cannot see and CI has no GPU to catch. This resolves the
      # includes and fails on two samplers at one (set, binding), or two bindings on one GL texture unit.
      - name: Audit shader descriptor bindings
        run: python3 tools/shader_bindings.py shaders
      # The real-time GI estimator against the tracer, in the same units and on the same scene. Slower than the other
      # steps on purpose: the reference is 32 samples a pixel. It writes renders/gi-*.png and fails the build if the
      # RMSE is past its budget — the measured value is ~0.038, and 0.05 is the point past which the model, not the
      # sampling, has changed.
      - name: Real-time GI estimator
        run: |
          mkdir -p renders
          UKIYO_RT_MAX_RMSE=0.05 ./build/pathtrace_preview realtime renders/gi-realtime.png . 480 270 8 4 32
          # The same pass against a converged truth, which also prints how much of the missing light it reproduces.
          UKIYO_RT_TRUTH_SPP=256 ./build/pathtrace_preview realtime renders/gi-truth-check.png . 160 90 8 4 64

      # The controller, driven through a route: writes docs/motion-demo.png and fails if the run is not sane.
      - name: Run Motion Demo
        run: mkdir -p renders && ./build/motion_demo renders/motion-demo.png

      - name: Run Hub Self-Test
        run: QT_QPA_PLATFORM=offscreen ./build/ukiyo_hub --selftest
      # The launcher's pages, grabbed offscreen: downloadable as the screenshots artifact and used by the docs.
      - name: Capture hub screenshots
        run: QT_QPA_PLATFORM=offscreen ./build/ukiyo_hub --screenshots renders
      # The splash, offscreen and with real content: beat 1 (the mark) and beat 2 (the artwork, lockup, status block).
      # This is the program's own output — the identity is drawn in C++ and its assets come from tools/brand.py.
      - name: Capture splash screenshots
        run: QT_QPA_PLATFORM=offscreen ./build/ukiyo_hub --splash-shots renders
      # The artifact host is not reachable from every environment, so the pictures a reviewer needs also land in the
      # repository: the hub's three pages are committed under docs/hub/ from CI, where they are actually rendered.
      # [skip ci] stops that commit from starting another build.
      - name: Publish hub screenshots
        if: github.event_name == 'push'
        run: |
          mkdir -p docs/hub
          cp renders/hub_projects.png renders/hub_templates.png renders/hub_about.png docs/hub/
          # The captures get their own names: docs/splash.png is the artwork itself, which docs/index.html uses as a
          # background, so the splash *screen* is a separate file.
          cp renders/splash.png docs/splash-capture.png
          cp renders/splash_mark.png docs/splash-mark.png
          git config user.name "ukiyo-ci"
          git config user.email "ci@ukiyo.invalid"
          git add docs/hub docs/splash-capture.png docs/splash-mark.png
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          # actions/checkout leaves a detached HEAD, so there is no branch to push to: name the ref explicitly, and
          # rebase first in case another push landed while this job was building. The fetch names the remote-tracking
          # ref explicitly — a bare `git fetch origin <branch>` only writes FETCH_HEAD in a shallow checkout, and the
          # rebase then has no upstream to use.
          branch="${GITHUB_REF_NAME}"
          git commit -m "Hub screenshots from CI [skip ci]"
          for attempt in 1 2 3; do
            git fetch origin "+refs/heads/$branch:refs/remotes/origin/$branch"
            git rebase "origin/$branch" || { git rebase --abort; exit 1; }
            if git push origin "HEAD:$branch"; then exit 0; fi
            sleep 5
          done
          echo "could not publish the screenshots; the artifact still has them" >&2
          exit 1

      # The self-test draws the sample terrain to renders/terrain_*.png. Keep them, so a graphics change can be
      # looked at without a local GL context.
      - name: Upload terrain renders
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terrain-renders
          path: |
            renders/terrain_*.png
            renders/hub_*.png
            renders/splash*.png
            renders/motion-demo.png
            renders/gi-*.png
          if-no-files-found: warn

  # --------------------------------------------------------------------------------------------- Windows (MSVC)
  # The same engine, built by a different compiler, against a different Vulkan loader, with a different Qt. The point
  # is not a second opinion on Linux: it is the platform most of the team's players run, and the input system in
  # particular has to prove it does not depend on POSIX or on GLFW's X11 backend.
  #
  # Where things come from:
  #   * MSVC and the Windows SDK: installed on windows-latest; the Visual Studio generator finds them, so no vcvars.
  #   * Vulkan SDK: preinstalled on the image, and it brings glslangValidator, the glslang CMake package and vulkan-1.lib.
  #   * Qt 6: aqtinstall via install-qt-action, cached between runs, because a Qt download is the slowest step here.
  #   * Everything else (GLM, GLFW, Jolt, Lua, miniaudio, Recast, ...) is vendored under third_party/ and needs no
  #     package manager at all — which is exactly why the checkout and the build are the only network-dependent steps.
  #
  # ccache is deliberately not used here: its MSVC support is young (it has to stay away from /Zi debug info and PDBs),
  # and a cache broken by a runner image update is worse than no cache. Qt and the Vulkan SDK are cached instead, and
  # the Ninja build compiles in parallel.
  windows:
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      # aqtinstall runs under the runner's default Python, which is newer than aqt supports for a while after each
      # Python release; 3.12 is the version the Qt action is tested against. This costs a few seconds and removes a
      # failure that has nothing to do with this repository.
      - name: Python for aqt
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.7.2"
          arch: win64_msvc2019_64
          cache: true
          cache-key-prefix: ukiyo-qt-windows

      # The image ships the SDK, but not every image version does; if VULKAN_SDK is unset the job installs it rather
      # than failing at find_package(Vulkan).
      - name: Check the Vulkan SDK
        run: |
          if (-not $env:VULKAN_SDK) {
            Write-Host "VULKAN_SDK is not set; installing the SDK"
            choco install vulkan-sdk -y --no-progress
            $sdk = Get-ChildItem "C:\VulkanSDK" -Directory | Sort-Object Name -Descending | Select-Object -First 1
            if (-not $sdk) { throw "the Vulkan SDK installed but C:\VulkanSDK is empty" }
            "VULKAN_SDK=$($sdk.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          }
          Write-Host "VULKAN_SDK=$env:VULKAN_SDK"

      # glslang: the SDK's own CMake package is broken (its SPIRV-Tools target points at a lib path that does not
      # exist), so the library comes from vcpkg. The triplet is the dynamic-CRT one on purpose: Qt is built /MD and
      # this build uses CMake's default /MD too, so a static-CRT glslang would fail the link with an
      # RuntimeLibrary mismatch. Its DLLs go on PATH for every later step. The prefix is cached — on a hit this is a
      # no-op, on a miss it builds glslang and its two SPIR-V dependencies, the slowest thing in the job.
      - name: Cache vcpkg packages
        uses: actions/cache@v4
        with:
          path: C:\vcpkg\installed
          key: vcpkg-glslang-${{ runner.os }}-2

      - name: Install glslang
        run: |
          & C:\vcpkg\vcpkg.exe install glslang:x64-windows --clean-after-build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "C:\vcpkg\installed\x64-windows\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      # The SDK's location, in annotations rather than the job log: when a package is missing, the useful question is
      # "what is actually installed", and this answers it without downloading anything.
      - name: Where the Vulkan SDK is
        run: |
          Write-Host "VULKAN_SDK=$env:VULKAN_SDK"
          Write-Host "::warning::VULKAN_SDK=$env:VULKAN_SDK"
          Get-ChildItem C:\VulkanSDK -Directory -ErrorAction SilentlyContinue |
            ForEach-Object { Write-Host "::warning::sdk dir: $($_.FullName)" }
          Get-ChildItem C:\VulkanSDK -Recurse -Filter "glslang*config.cmake" -ErrorAction SilentlyContinue |
            Select-Object -First 5 | ForEach-Object { Write-Host "::warning::glslang config: $($_.FullName)" }
          $v = Get-Command glslangValidator -ErrorAction SilentlyContinue
          if ($v) { Write-Host "::warning::glslangValidator: $($v.Source)" } else { Write-Host "::warning::glslangValidator: not on PATH" }

      # Ninja rather than the Visual Studio generator: it is the configuration MSVC developers actually use, it compiles
      # translation units in parallel by default, and it puts the binaries in one directory instead of per-config
      # subdirectories. vcvars is what supplies cl.exe and the SDK to CMake.
      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # Configure and build are teed to files so a failure can be lifted into annotations: the job log lives behind a
      # signed URL on a host this repository's tooling cannot always reach, and an annotation is readable from the API.
      - name: Configure CMake
        run: |
          # CMAKE_PREFIX_PATH keeps whatever Qt set and adds the vcpkg prefix, so both packages are found and neither
          # search path is lost.
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_PREFIX_PATH="$env:CMAKE_PREFIX_PATH;C:/vcpkg/installed/x64-windows" `
            2>&1 | Tee-Object -FilePath configure.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build Everything
        run: |
          $env:CL = "/MP"
          cmake --build build 2>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Annotate configure errors
        if: failure()
        run: |
          if (Test-Path configure.log) {
            # Context matters: "CMake Error at CMakeLists.txt:2 (project):" says nothing on its own, the line under it
            # names the compiler or generator that was missing.
            Get-Content configure.log | Select-String -Pattern "CMake Error" -Context 0,4 |
              Select-Object -First 12 |
              ForEach-Object {
                Write-Host ("::error::" + ($_.Line -replace '%','%25'))
                $_.Context.PostContext | ForEach-Object { Write-Host "::error::  $_" }
              }
          }

      - name: Annotate compile errors
        if: failure()
        run: |
          if (Test-Path build.log) {
            Select-String -Path build.log -Pattern "error C[0-9]+|error LNK|fatal error" |
              Select-Object -First 40 |
              ForEach-Object { Write-Host ("::error::" + ($_.Line -replace '%','%25')) }
          }

      # The same tests the Linux job runs, in the same order, in one step: a failing test's own output is the only
      # useful diagnostic, and the job log is not reachable from everywhere, so the last lines go out as annotations.
      - name: Run the portable tests
        run: |
          $failed = @()
          foreach ($t in @("systems_test", "network_test", "project_test", "vgeom_test", "motion_test", "gi_test", "input_test")) {
            Write-Host "::group::$t"
            $out = & "./build/$t.exe" 2>&1
            $code = $LASTEXITCODE
            $out | ForEach-Object { Write-Host $_ }
            Write-Host "::endgroup::"
            if ($code -ne 0) {
              Write-Host "::error::$t failed with exit code $code"
              # The failing assertions first, then the summary line, then the tail: a test can print hundreds of PASS
              # lines, and the interesting ones are never the last.
              $fails = $out | Select-String -Pattern "FAIL|ERROR|error:" | Select-Object -First 10
              if ($fails) { $fails | ForEach-Object { Write-Host "::error::  $($_.Line)" } }
              $summary = $out | Select-String -Pattern "passed|failed|checks" | Select-Object -Last 2
              if ($summary) { $summary | ForEach-Object { Write-Host "::error::  $($_.Line)" } }
              $out | Select-Object -Last 4 | ForEach-Object { Write-Host "::error::  $_" }
              $failed += $t
            }
          }
          if ($failed.Count -gt 0) { throw "failed: $($failed -join ', ')" }

      # The hub is the only Qt program CI can run without a desktop: offscreen, the same self-test the Linux job runs.
      - name: Run Hub Self-Test
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          ./build/ukiyo_hub.exe --selftest

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-build-log
          path: |
            configure.log
            build.log
          if-no-files-found: warn
